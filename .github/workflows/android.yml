name: Android APK

on:
  push:
    branches: [main, "claude/android-tablet"]
    tags: ["android-v*"]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (protocol / payload / sender)
        run: ./gradlew --no-daemon :core:test
      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ccs3000-ink-tablet.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ccs3000-ink-tablet-apk
          path: android/ccs3000-ink-tablet.apk
      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/ccs3000-ink-tablet.apk
